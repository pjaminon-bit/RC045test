# RC045test #136 — server-side least-privilege policy for the GitHub deploy account.
# Keep this file lexically early: OpenSSH uses the first obtained value for a keyword.
Match User vst-deploy
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/local/bin/verenigingsplatform-github-entry

# Do not leak the Match context into later sshd_config/includes.
Match All
