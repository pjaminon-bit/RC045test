name: Diagnose live DEV

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  LIVE_DEV_BASE_URL: https://rc045.nl/dev
  PLAYWRIGHT_TEST_BASE_URL: https://rc045.nl/dev

jobs:
  endpoint-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Controleer kritieke DEV-routes
        shell: bash
        run: |
          set -euo pipefail
          basis='https://rc045.nl/dev'
          check() {
            local url="$1" verwacht="$2" follow="${3:-nee}"
            local status
            if [[ "$follow" == ja ]]; then
              status="$(curl -sS -L -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            else
              status="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
            fi
            echo "$url -> $status (verwacht $verwacht)"
            [[ "$status" == "$verwacht" ]]
          }
          check "$basis/" 200 ja
          check "$basis/beheer/" 200 ja
          check "$basis/leden/" 200 ja
          check "$basis/aanmelden.html" 200 ja
          check "$basis/beheer/leden.php" 302 nee
          check "$basis/beheer/gebruikers.php" 302 nee
          check "$basis/app/auth-storage.php" 403 nee
          check "$basis/dev-build.json" 403 nee

  live-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Actieve DEV securityregressie
        run: bash tests/live-dev-security.sh

  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installeer browsertooling
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Functionele en optische browseracceptatie
        run: npx playwright test tests/live-dev-browser.spec.js --workers=1 --reporter=line
