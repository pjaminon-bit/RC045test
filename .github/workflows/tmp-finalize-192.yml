name: Temporary finalize CSP 192

on:
  push:
    branches:
      - tmp-finalize-192-clean

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply deterministic migration
        run: |
          set +e
          python3 tools/finalize192.py
          rc=$?
          set -e
          echo "finalize generator exit=$rc (known generated-test lint may be nonzero)"
          cp tools/csp-style-regression-final.php tests/csp-style-source-regression.php
          python3 tools/fix-phase483.py
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l >/dev/null
      - name: Remove temporary helper artifacts
        run: |
          rm -f tools/finalize192.py tools/csp-style-regression-final.php tools/fix-phase483.py .github/workflows/tmp-finalize-192.yml
      - name: Commit and verify clean product tree
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Security: finalize style CSP hardening (#192)"
          php tests/csp-style-source-regression.php
          php tests/security-205-static-style-assets.php
          php tests/csp-script-source-regression.php
          php tests/phase483-suspended-placeholder.php
          php tests/phase51-control-plane.php
          git status --short
          git push origin HEAD:tmp-finalize-192-clean
