name: Pilot319 TEST verify

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pilot319-test-verify.yml

permissions:
  contents: read
  pull-requests: read
  issues: write
  id-token: write

concurrency:
  group: pilot319-test-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: vps-test
    env:
      DEPLOY_SHA: ${{ github.sha }}
      VPS_TAILSCALE_HOST: ${{ vars.VPS_TEST_TAILSCALE_HOST || '100.104.242.66' }}
      VPS_SSH_HOST_ALIAS: vps.holox.nl
      VPS_SSH_USER: ${{ vars.VPS_TEST_SSH_USER || 'vst-deploy' }}
      VPS_SSH_PORT: ${{ vars.VPS_TEST_SSH_PORT || '22' }}
      PILOT_BASE_URL: https://pilot319.149-143-36-59.sslip.io

    steps:
      - name: Valideer main-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          prs="$(gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/pulls")"
          jq -e 'any(.[]; .merged_at != null and .base.ref == "main")' <<<"$prs" >/dev/null

      - name: Verbind runner met TEST-tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-rc045test
          version: 1.94.2
          ping: ${{ vars.VPS_TEST_TAILSCALE_HOST || '100.104.242.66' }}

      - name: Deploy actuele main naar VPS TEST
        id: deploy
        env:
          VPS_TEST_DEPLOY_KEY: ${{ secrets.VPS_TEST_DEPLOY_KEY }}
          VPS_TEST_SSH_KNOWN_HOSTS: ${{ secrets.VPS_TEST_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VPS_TEST_DEPLOY_KEY:-}" ]]
          [[ -n "${VPS_TEST_SSH_KNOWN_HOSTS:-}" ]]
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$VPS_TAILSCALE_HOST" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]

          ssh_dir="$(mktemp -d "$RUNNER_TEMP/pilot319-ssh.XXXXXX")"
          trap 'rm -rf "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          umask 077
          key="$ssh_dir/deploy-key"
          known_hosts="$ssh_dir/known_hosts"
          printf '%s\n' "$VPS_TEST_DEPLOY_KEY" > "$key"
          printf '%s\n' "$VPS_TEST_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"

          output="$(ssh \
            -i "$key" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o HostKeyAlias="$VPS_SSH_HOST_ALIAS" \
            -o ConnectTimeout=15 \
            "$VPS_SSH_USER$@VPS_TAILSCALE_HOST" \
            "deploy $DEPLOY_SHA")"
          printf '%s\n' "$output"
          grep -Fqx "DEPLOYED $DEPLOY_SHA" <<<"$output"

      - name: Verifieer pilot319 web en beheer
        id: pilot-smoke
        shell: bash
        run: |
          set -euo pipefail

          wacht_op_status() {
            local url="$1"
            local verwacht="$2"
            local volg="${3:-nee}"
            local status=""
            for poging in 1 2 3 4 5 6; do
              if [[ "$volg" == "ja" ]]; then
                status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              else
                status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              fi
              if [[ "$status" == "$verwacht" ]]; then
                echo "OK: $url -> HTTP $status"
                return 0
              fi
              echo "Poging $poging: $url -> HTTP ${status:-geen}; verwacht $verwacht"
              sleep 5
            done
            return 1
          }

          wacht_op_status "$PILOT_BASE_URL/" 200 ja
          wacht_op_status "$PILOT_BASE_URL/beheer/" 200 ja
          wacht_op_status "$PILOT_BASE_URL/healthz.php" 204 nee

      - name: Leg verificatieresultaat vast in issue 319
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          PILOT_OUTCOME: ${{ steps.pilot-smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ "$DEPLOY_OUTCOME" == "success" && "$PILOT_OUTCOME" == "success" ]]; then
            body="TEST-verificatie pilot319 geslaagd op $DEPLOY_SHA.

- immutable deploy via bestaande restricted Tailscale/SSH-route: groen
- pilot319 root: HTTP 200
- pilot319 beheer: HTTP 200
- pilot319 healthz: HTTP 204
- de eerdere beheer-503 rond session.save_path is daarmee op TEST niet meer reproduceerbaar

Run: $run_url

#319 blijft alleen nog open voor de expliciete branding/content- en recovery/pilot-readinessgrens. LIVE is niet gewijzigd."
          else
            body="TEST-verificatie pilot319 is niet volledig groen op $DEPLOY_SHA.

- deploystap: $DEPLOY_OUTCOME
- pilot web/beheer smoke: $PILOT_OUTCOME

Run: $run_url

Geen LIVE-mutatie uitgevoerd. #319 blijft open."
          fi

          gh issue comment 319 --repo "$GITHUB_REPOSITORY" --body "$body"
