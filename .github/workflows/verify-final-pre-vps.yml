name: Verify final pre-VPS live

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/verify-final-pre-vps.yml'

permissions:
  contents: read

concurrency:
  group: rc045test-verify-final-pre-vps-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  LIVE_DEV_BASE_URL: https://rc045.nl/dev
  PLAYWRIGHT_TEST_BASE_URL: https://rc045.nl/dev

jobs:
  wait-live-sponsor-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wacht op directe sponsorplaceholder zonder redirect
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://rc045.nl/dev/images/sponsors/traxxas.png'
            'https://rc045.nl/dev/images/sponsors/kok-lexmond.png'
            'https://rc045.nl/dev/images/sponsors/toemen.png'
            'https://rc045.nl/dev/images/sponsors/shamrock.png'
            'https://rc045.nl/dev/images/sponsors/rothy.png'
          )
          for poging in $(seq 1 60); do
            alles_ok=1
            for basis in "${urls[@]}"; do
              headers="$RUNNER_TEMP/headers"
              body="$RUNNER_TEMP/body"
              url="${basis}?verify=${GITHUB_RUN_ID}-${poging}"
              meta="$(curl --http2 --silent --show-error --dump-header "$headers" --output "$body" --write-out '%{http_code}|%{redirect_url}|%{content_type}' "$url" || true)"
              IFS='|' read -r code redirect content_type <<< "$meta"
              if [[ "$code" != '200' || -n "$redirect" || "$content_type" != image/svg+xml* ]] || ! grep -q '<svg' "$body"; then
                alles_ok=0
                break
              fi
            done
            if [[ "$alles_ok" == '1' ]]; then
              echo 'LIVE SPONSORGATEWAY OK: vijf ontbrekende sponsorlogo’s geven direct HTTP 200 SVG zonder redirect.'
              exit 0
            fi
            sleep 5
          done
          echo 'FOUT: live DEV heeft de directe sponsorgateway niet aantoonbaar bereikt.' >&2
          exit 1

  live-security:
    needs: wait-live-sponsor-gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finale main-bron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 51c3954964b7b44e9d4db03b43dfe6670b8b01b3
      - name: Actieve DEV securityregressie
        run: bash tests/live-dev-security.sh

  live-browser:
    needs:
      - wait-live-sponsor-gateway
      - live-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout finale main-bron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 51c3954964b7b44e9d4db03b43dfe6670b8b01b3
      - name: Installeer gelockte browserdependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Finale publieke browseracceptatie
        run: npx playwright test tests/live-dev-browser.spec.js --workers=1 --reporter=line
