name: Temporary Security 205 Migration

on:
  push:
    branches:
      - security/205-upload-helper-v2

permissions:
  contents: write

concurrency:
  group: temp-security-205-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: security/205-upload-helper-v2
          fetch-depth: 0

      - name: Verify isolated starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "security/205-upload-helper-v2"
          git merge-base --is-ancestor 4ca8f2db858b294f3b16f574dfa1eb81c365c681 HEAD
          test -z "$(git status --porcelain)"

      - name: Generate deterministic static style migration
        run: python3 .github/csp205-build.py

      - name: PHP syntax check migrated sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            php -l "$file" >/dev/null
          done < <(git diff --name-only --diff-filter=ACM -- '*.php')

      - name: Create self-cleaning product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/csp205-build.py .github/workflows/temp-security-205-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Security: externalize static inline styles (#205)"
          php tests/security-205-static-style-assets.php
          test -z "$(git status --porcelain)"
          git push origin HEAD:security/205-upload-helper-v2
