name: Temporary Phase 211 Phase B verify

on:
  push:
    branches:
      - helper/211-phase-b-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apply deterministic source transform
        run: python3 tools/phase211b_transform.py

      - name: Diff and syntax
        run: |
          git diff --check
          php -l app/storage/private-store-migration-guard.php
          php -l app/storage/private-store-runtime-state.php
          php -l app/storage/private-json-pdo-migration.php
          php -l app/storage/private-store.php
          php -l app/deployment/database-contract.php
          php -l bin/prepare-vps-database.php
          php -l bin/migrate-private-json-to-pdo.php
          php -l bin/apply-private-store-migration.php
          php -l tests/platform211-json-pdo-migration.php
          bash -n ops/vps-test-deploy/verenigingsplatform-host-php

      - name: Focused migration regression
        run: php tests/platform211-json-pdo-migration.php

      - name: JavaScript syntax regression
        run: |
          while IFS= read -r -d '' js; do
            node --check "$js"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './vendor/*' -not -path './playwright-report/*' -print0)

      - name: Audit PHP regressions
        run: |
          while IFS= read -r test_file; do php "$test_file"; done < <(find tests -maxdepth 1 -type f -name 'audit*.php' | sort)

      - name: Phase PHP regressions
        run: |
          while IFS= read -r test_file; do php "$test_file"; done < <(find tests -maxdepth 1 -type f -name 'phase*.php' | sort)

      - name: Platform PHP regressions
        run: |
          while IFS= read -r test_file; do php "$test_file"; done < <(find tests -maxdepth 1 -type f -name 'platform*.php' | sort)

  discover-remaining:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.tests }}
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: tests
        name: Discover remaining PHP regressions
        shell: bash
        run: |
          tests="$(python3 - <<'PY'
          import json
          from pathlib import Path
          items=[]
          for p in sorted(Path('tests').glob('*.php')):
              n=p.name
              if n.startswith(('audit','phase','platform')):
                  continue
              items.append(str(p))
          print(json.dumps(items,separators=(',',':')))
          PY
          )"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  remaining:
    needs: [core, discover-remaining]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.discover-remaining.outputs.tests) }}
    name: remaining — ${{ matrix.test }}
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Apply deterministic source transform
        run: python3 tools/phase211b_transform.py
      - name: Run regression
        run: php "${{ matrix.test }}"

  repository-boundaries:
    needs: [remaining]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Repository boundaries
        run: test ! -e site-config.local.php
