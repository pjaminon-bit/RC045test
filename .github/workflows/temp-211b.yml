name: Temporary Phase 211 Phase B materialize

on:
  push:
    branches:
      - helper/211-phase-b-run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: helper/211-phase-b-run

      - name: Apply deterministic source transform
        run: python3 tools/phase211b_transform.py

      - name: Verify transformed source
        run: |
          git diff --check
          php -l app/storage/private-store.php
          php -l app/deployment/database-contract.php
          php -l bin/prepare-vps-database.php
          bash -n ops/vps-test-deploy/verenigingsplatform-host-php
          php tests/platform211-json-pdo-migration.php
          bash tests/run-all.sh

      - name: Remove temporary materialization helpers
        run: |
          rm .github/workflows/temp-211b.yml
          rm tools/phase211b_transform.py
          git diff --check

      - name: Commit permanent Phase B source
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            app/storage/private-store.php \
            app/deployment/database-contract.php \
            bin/prepare-vps-database.php \
            ops/vps-test-deploy/verenigingsplatform-host-php \
            app/deployment/privileged-ops-contract.php \
            .github/workflows/temp-211b.yml \
            tools/phase211b_transform.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'FOUT: geen materialiseerbare wijzigingen.' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement #211 Phase B runtime cutover wiring'
          git push origin HEAD:helper/211-phase-b-run
