name: Diagnose sponsor HTTP2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecteer directe sponsorplaceholder via HTTP2
        shell: bash
        run: |
          set -u
          names=(traxxas.png kok-lexmond.png toemen.png shamrock.png rothy.png)
          for name in "${names[@]}"; do
            url="https://rc045.nl/dev/images/sponsors/$name?v=2026-test"
            echo "=== $name ==="
            curl --http2 --silent --show-error --dump-header - --output "/tmp/$name" --write-out "HTTP=%{http_code} HTTP_VERSION=%{http_version} SIZE=%{size_download}\n" --connect-timeout 10 --max-time 30 "$url" | tr -d '\r'
            file "/tmp/$name" || true
            sha256sum "/tmp/$name" || true
            printf 'FIRST='; head -c 80 "/tmp/$name" | tr '\n' ' '; echo
          done

          echo '=== vijf gelijktijdige directe requests ==='
          printf '%s\n' "${names[@]}" | xargs -P5 -I{} sh -c 'curl --http2 --silent --show-error --dump-header /tmp/h-{} --output /tmp/p-{} --write-out "{} HTTP=%{http_code} HTTP_VERSION=%{http_version} SIZE=%{size_download} ERR=%{errormsg}\\n" --connect-timeout 10 --max-time 30 "https://rc045.nl/dev/images/sponsors/{}?v=2026-test" || true'
          for name in "${names[@]}"; do echo "--- $name headers ---"; tr -d '\r' < "/tmp/h-$name" | grep -Ei '^(HTTP/|content-type:|content-length:|content-encoding:|cache-control:|etag:|location:)' || true; done
