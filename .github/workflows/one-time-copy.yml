name: One-time copy RC045 to test

on:
  push:
    paths:
      - '.github/workflows/one-time-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC045test
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone production source
        run: git clone --depth 1 https://github.com/pjaminon-bit/rc045.git /tmp/rc045-source

      - name: Replace test repository contents without production workflows
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/rc045-source/ ./

      - name: Add TESTSITE banner to index.php
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.php')
          s = p.read_text(encoding='utf-8')
          marker = '<body'
          pos = s.lower().find(marker)
          if pos < 0:
              raise SystemExit('Geen <body> gevonden in index.php')
          end = s.find('>', pos)
          if end < 0:
              raise SystemExit('Ongeldige <body>-tag in index.php')
          banner = '''\n<div id="testsite-banner" role="status" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99999;background:#b42318;color:#fff;padding:5px 12px;border-radius:999px;font:700 12px/1.2 Arial,sans-serif;letter-spacing:.08em;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none">TESTSITE</div>\n'''
          s = s[:end+1] + banner + s[end+1:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove this one-time workflow
        run: rm -f .github/workflows/one-time-copy.yml

      - name: Commit copied test site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Copy current RC045 site to test without deploy workflow'
          git push origin main
