name: Full regression acceptance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy RC045test to VPS test
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: rc045test-full-regression-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

env:
  LIVE_DEV_BASE_URL: https://test.vps.holox.nl
  PLAYWRIGHT_TEST_BASE_URL: https://test.vps.holox.nl

jobs:
  source-regression:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       vars.VPS_TEST_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact te testen bron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Runtimeversies
        run: |
          set -euo pipefail
          php -v
          node --version
          npm --version
      - name: PHP syntax van volledige repository
        run: |
          set -euo pipefail
          while IFS= read -r -d '' bestand; do php -l "$bestand"; done < <(find . -type f -name '*.php' -not -path './node_modules/*' -print0)
          node --check tests/live-dev-browser.spec.js
          node --check tests/live-dev-authenticated.spec.js
      - name: Alle functionele technische en securityregressies
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run-all.sh 2>&1 | tee "$RUNNER_TEMP/regression-output.log"
      - name: Bewaar regressiediagnose
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: source-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/regression-output.log
          if-no-files-found: warn
          retention-days: 14

  live-security:
    needs: source-regression
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       vars.VPS_TEST_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Actieve VPS-test securityregressie
        run: bash tests/live-dev-security.sh

  live-browser:
    needs: source-regression
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       vars.VPS_TEST_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Installeer gelockte browserdependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Functionele en optische VPS-testacceptatie
        run: npx playwright test tests/live-dev-browser.spec.js --workers=1 --reporter=line,html
      - name: Bewaar screenshots en browserrapport
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-acceptance-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  live-authenticated:
    needs: source-regression
    if: >-
      vars.VPS_TEST_AUTH_E2E_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        vars.VPS_TEST_DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rc045test-vps-auth-fixture
      cancel-in-progress: false
    env:
      E2E_ADMIN_USER: ${{ secrets.VPS_TEST_ADMIN_USER }}
      E2E_MEMBER_USER: ${{ secrets.VPS_TEST_MEMBER_USER }}
      E2E_PASSWORD: ${{ secrets.VPS_TEST_E2E_PASSWORD }}
    steps:
      - name: Checkout exact gedeployde bron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Controleer dedicated VPS-testidentiteiten
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${E2E_ADMIN_USER:-}" ]] || { echo 'VPS_TEST_ADMIN_USER ontbreekt' >&2; exit 1; }
          [[ -n "${E2E_MEMBER_USER:-}" ]] || { echo 'VPS_TEST_MEMBER_USER ontbreekt' >&2; exit 1; }
          [[ -n "${E2E_PASSWORD:-}" ]] || { echo 'VPS_TEST_E2E_PASSWORD ontbreekt' >&2; exit 1; }
          echo "::add-mask::$E2E_ADMIN_USER"
          echo "::add-mask::$E2E_MEMBER_USER"
          echo "::add-mask::$E2E_PASSWORD"
      - name: Installeer gelockte browsertooling
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Bewijs authenticated beheer en gekoppeld ledenportaal op VPS-test
        run: npx playwright test tests/live-dev-authenticated.spec.js --workers=1 --reporter=line,html
      - name: Bewaar authenticated screenshots en rapport
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: authenticated-browser-acceptance-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
