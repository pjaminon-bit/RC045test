name: Issue 226 front-controller browser proof

on:
  push:
    branches:
      - agent/template-foundation
  workflow_dispatch:

permissions:
  contents: read

env:
  PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080

jobs:
  front-controller-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branchfix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installeer gelockte browser zonder OS-package-mutatie
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Start public-root frontcontroller lokaal
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t public public/index.php > /tmp/issue-226-php-server.log 2>&1 &
          echo $! > /tmp/issue-226-php-server.pid
          for poging in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/issue-226-php-server.log >&2 || true
          exit 1
      - name: Bewijs publieke rendersemantiek achter branchfrontcontroller
        run: npx playwright test tests/architecture-226-frontcontroller-browser.spec.js --workers=1 --reporter=line
      - name: Stop lokale frontcontroller
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/issue-226-php-server.pid ]]; then
            kill "$(cat /tmp/issue-226-php-server.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/issue-226-php-server.log ]]; then
            tail -n 200 /tmp/issue-226-php-server.log
          fi