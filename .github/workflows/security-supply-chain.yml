name: Security supply-chain

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc045test-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout volledige Git-historie
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, commit-pinned
        with:
          fetch-depth: 0

      - name: Scan volledige historie op secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3 / Node 24, commit-pinned
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Installeer uitsluitend gelockte Node dependencies
        run: npm ci --ignore-scripts

      - name: Controleer Node dependencies op hoge/critical kwetsbaarheden
        run: npm audit --audit-level=high

      - name: Controleer eigen security source policy
        run: php tests/security-source-regression.php

      - name: Controleer pre-VPS securitycontract
        run: php tests/security-pre-vps-hardening.php
