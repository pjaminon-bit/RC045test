name: Validate and deploy RC045test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc045test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Controleer PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -v
          while IFS= read -r -d '' bestand; do
            php -l "$bestand"
          done < <(find . -type f -name '*.php' -print0)

      - name: Basis architectuurtest
        run: php tests/phase25-architecture.php

      - name: Uitgebreide platformtests
        shell: bash
        run: |
          set -euo pipefail
          node --check lidmaatschap-aanmelden.js
          php tests/phase25-domain-integrity.php
          php tests/phase251-groups.php
          php tests/phase252-ux.php
          php tests/phase26-ui.php
          php tests/phase262-ui.php
          php tests/phase31-tenant-boundary.php
          php tests/phase32-provisioner.php
          php tests/phase321-runtime-failclosed.php
          php tests/phase321-auth-isolation.php
          php tests/phase321-session-tenant-binding.php
          php tests/phase321-provisioner-path-security.php
          php tests/phase321-public-content-isolation.php
          php tests/phase321-public-assets-isolation.php
          php tests/phase321-public-assets-parent-symlink.php
          php -m | grep -qi '^pdo_sqlite$' || { echo 'pdo_sqlite ontbreekt op de runner' >&2; exit 1; }
          php tests/phase321-tenant-backups.php
          php tests/phase33-second-tenant.php
          php tests/phase34-admin-bootstrap.php
          php tests/phase35-vps-deployment.php
          php tests/phase351-security-reaudit.php
          php tests/phase351-master-session-generation.php
          php tests/phase41-vps-runtime-isolation.php
          php tests/phase411-runtime-reaudit.php
          php tests/phase42-apache-vhosts.php
          php tests/phase43-dns-readiness.php
          php tests/phase44-tls-https.php
          php tests/phase45-database-provisioning.php
          php tests/phase451-database-reaudit.php
          php tests/phase46-monitoring-logging.php
          php tests/phase47-release-rollback.php
          php tests/phase48-tenant-lifecycle.php
          php tests/phase481-purge-recovery-hardening.php
          php tests/phase51-control-plane.php
          php tests/phase511-control-plane-identity.php
          php tests/phase512-control-plane-auth.php
          php tests/phase513-control-plane-rate-limit.php
          php tests/phase52-first-vps-bootstrap.php
          php tests/private-store-pdo-sqlite.php
          php tests/phase321-pdo-isolation.php
          php tests/private-store-pdo-failclosed.php
          test ! -e site-config.local.php

  deploy-dev:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testcode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Schrijf DEV buildinformatie
        shell: bash
        run: |
          cat > dev-build.json <<EOF
          {
            "environment": "dev",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "commit_short": "${GITHUB_SHA::8}",
            "deployed_at_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF

      - name: Upload testsite via SFTP naar gekoppelde dev-root
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './*'
          remote_path: '/'

      - name: Upload .htaccess expliciet naar DEV
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './.htaccess'
          remote_path: '/'

      - name: Smoke test gedeployde DEV-site
        shell: bash
        run: |
          set -euo pipefail
          basis='https://rc045.nl/dev'
          wacht_op_status() {
            local url="$1"
            local verwacht="$2"
            local volg_redirects="${3:-nee}"
            local poging status
            for poging in 1 2 3 4 5 6; do
              if [[ "$volg_redirects" == 'ja' ]]; then
                status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              else
                status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              fi
              if [[ "$status" == "$verwacht" ]]; then echo "OK: $url -> HTTP $status"; return 0; fi
              echo "Poging $poging: $url gaf HTTP ${status:-geen}, verwacht $verwacht"; sleep 5
            done
            echo "FOUT: $url gaf na meerdere pogingen niet HTTP $verwacht" >&2; return 1
          }

          wacht_op_status "$basis/" 200 ja
          wacht_op_status "$basis/beheer/" 200 ja
          wacht_op_status "$basis/beheer/ui-2026.css" 200 nee
          wacht_op_status "$basis/leden/" 200 ja
          wacht_op_status "$basis/aanmelden.html" 200 ja
          wacht_op_status "$basis/healthz.php" 404 nee

          for route in leden.php leden-import.php ledenlabels.php commissies.php werkgroepen.php groepsrollen.php groep-relaties.php vergaderingen.php taken.php operationele-taken.php evenementen.php aanmeldingen.php lidmaatschap.php contributies.php gebruikers.php logboek.php backups.php; do
            wacht_op_status "$basis/beheer/$route" 302 nee
          done
          wacht_op_status "$basis/beheer/lid-groepen.php?id=test" 308 nee

          wacht_op_status "$basis/data/lidmaatschapstypen.json" 200 nee
          wacht_op_status "$basis/public-content.php?key=lidmaatschapstypen" 200 nee
          wacht_op_status "$basis/public-content.php?key=../auth/users" 404 nee
          wacht_op_status "$basis/public-asset.php?scope=sponsors&path=missing.jpg" 404 nee
          wacht_op_status "$basis/public-asset.php?scope=sponsors&path=shell.php" 404 nee
          wacht_op_status "$basis/app/paneel-hulp.php" 403 nee
          wacht_op_status "$basis/app/operational-log.php" 403 nee
          wacht_op_status "$basis/app/deployment/monitoring-contract.php" 403 nee
          wacht_op_status "$basis/app/deployment/release-contract.php" 403 nee
          wacht_op_status "$basis/app/deployment/lifecycle-contract.php" 403 nee
          wacht_op_status "$basis/app/deployment/lifecycle-purge-hardening.php" 403 nee
          wacht_op_status "$basis/app/deployment/control-plane-contract.php" 403 nee
          wacht_op_status "$basis/app/deployment/control-plane-identity.php" 403 nee
          wacht_op_status "$basis/app/deployment/control-plane-auth-hardening.php" 403 nee
          wacht_op_status "$basis/app/deployment/first-vps-bootstrap-contract.php" 403 nee
          wacht_op_status "$basis/app/control-plane/control-plane-runtime.php" 403 nee
          wacht_op_status "$basis/app/control-plane-web/index.php" 403 nee
          wacht_op_status "$basis/aanmeldingen-opslag.php" 403 nee
          wacht_op_status "$basis/groepen-opslag.php" 403 nee
          wacht_op_status "$basis/ledenlabels-opslag.php" 403 nee
          wacht_op_status "$basis/beheer/backup-registry.php" 403 nee
          wacht_op_status "$basis/bin/provision-tenant.php" 403 nee
          wacht_op_status "$basis/bin/bootstrap-tenant-admin.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-deployment.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-runtime.php" 403 nee
          wacht_op_status "$basis/bin/apply-vps-runtime.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-webserver.php" 403 nee
          wacht_op_status "$basis/bin/apply-vps-webserver.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-dns.php" 403 nee
          wacht_op_status "$basis/bin/check-vps-dns.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-tls.php" 403 nee
          wacht_op_status "$basis/bin/apply-vps-tls.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-database.php" 403 nee
          wacht_op_status "$basis/bin/apply-vps-database.php" 403 nee
          wacht_op_status "$basis/bin/check-vps-database.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-monitoring.php" 403 nee
          wacht_op_status "$basis/bin/apply-vps-monitoring.php" 403 nee
          wacht_op_status "$basis/bin/check-vps-health.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-release.php" 403 nee
          wacht_op_status "$basis/bin/apply-vps-release.php" 403 nee
          wacht_op_status "$basis/bin/check-release-tenant.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-lifecycle.php" 403 nee
          wacht_op_status "$basis/bin/apply-vps-lifecycle.php" 403 nee
          wacht_op_status "$basis/bin/prepare-vps-control-plane.php" 403 nee
          wacht_op_status "$basis/bin/apply-vps-control-plane.php" 403 nee
          wacht_op_status "$basis/bin/control-plane-executor.php" 403 nee
          wacht_op_status "$basis/bin/bootstrap-control-plane-operator.php" 403 nee
          wacht_op_status "$basis/bin/prepare-first-vps-bootstrap.php" 403 nee
          wacht_op_status "$basis/bin/apply-first-vps-bootstrap.php" 403 nee
          wacht_op_status "$basis/tests/phase35-vps-deployment.php" 403 nee
          wacht_op_status "$basis/tests/phase351-security-reaudit.php" 403 nee
          wacht_op_status "$basis/tests/phase41-vps-runtime-isolation.php" 403 nee
          wacht_op_status "$basis/tests/phase411-runtime-reaudit.php" 403 nee
          wacht_op_status "$basis/tests/phase42-apache-vhosts.php" 403 nee
          wacht_op_status "$basis/tests/phase43-dns-readiness.php" 403 nee
          wacht_op_status "$basis/tests/phase44-tls-https.php" 403 nee
          wacht_op_status "$basis/tests/phase45-database-provisioning.php" 403 nee
          wacht_op_status "$basis/tests/phase451-database-reaudit.php" 403 nee
          wacht_op_status "$basis/tests/phase46-monitoring-logging.php" 403 nee
          wacht_op_status "$basis/tests/phase47-release-rollback.php" 403 nee
          wacht_op_status "$basis/tests/phase48-tenant-lifecycle.php" 403 nee
          wacht_op_status "$basis/tests/phase481-purge-recovery-hardening.php" 403 nee
          wacht_op_status "$basis/tests/phase51-control-plane.php" 403 nee
          wacht_op_status "$basis/tests/phase511-control-plane-identity.php" 403 nee
          wacht_op_status "$basis/tests/phase512-control-plane-auth.php" 403 nee
          wacht_op_status "$basis/tests/phase513-control-plane-rate-limit.php" 403 nee
          wacht_op_status "$basis/tests/phase52-first-vps-bootstrap.php" 403 nee
          wacht_op_status "$basis/docs/VPS-DEPLOYMENT.md" 403 nee
          wacht_op_status "$basis/docs/VPS-WEBSERVER.md" 403 nee
          wacht_op_status "$basis/docs/VPS-DNS.md" 403 nee
          wacht_op_status "$basis/docs/VPS-TLS.md" 403 nee
          wacht_op_status "$basis/docs/VPS-DATABASE.md" 403 nee
          wacht_op_status "$basis/docs/VPS-MONITORING.md" 403 nee
          wacht_op_status "$basis/docs/VPS-RELEASES.md" 403 nee
          wacht_op_status "$basis/docs/VPS-LIFECYCLE.md" 403 nee
          wacht_op_status "$basis/docs/VPS-CONTROL-PLANE.md" 403 nee
          wacht_op_status "$basis/docs/VPS-FIRST-BOOTSTRAP.md" 403 nee
          wacht_op_status "$basis/dev-build.json" 403 nee
