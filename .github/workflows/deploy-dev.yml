name: Deploy template-foundation naar Strato /dev

on:
  push:
    branches:
      - agent/template-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc045-dev-deploy
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testcode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Eenmalige migratie interne helpers naar app
        shell: bash
        run: |
          python3 tools/refactor-app-helpers.py
          php -l auth.php
          php -l app/auth-session-check.php
          php -l app/data-slot.php
          php -l app/paneel-hulp.php
          php -l leden-opslag.php
          php -l beheer/gebruikers.php
          php -l beheer/index.php
          php -l leden-app.php
          git diff --check

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A auth-session-check.php data-slot.php paneel-hulp.php app auth.php leden-opslag.php beheer/gebruikers.php beheer/index.php leden-app.php .htaccess
            git commit -m 'Move internal helpers into app directory'
            git push origin HEAD:agent/template-foundation
            echo 'Migratie gecommit; de branch-push start automatisch een frisse DEV-deploy.'
          fi

      - name: Controleer PHP syntax
        shell: bash
        run: |
          php -v
          while IFS= read -r -d '' bestand; do
            php -l "$bestand"
          done < <(find . -type f -name '*.php' -print0)

      - name: Schrijf DEV buildinformatie
        shell: bash
        run: |
          cat > dev-build.json <<EOF
          {
            "environment": "dev",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "commit_short": "${GITHUB_SHA::8}",
            "deployed_at_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF

      - name: Upload testsite via SFTP naar gekoppelde dev-root
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './*'
          remote_path: '/'

      # ./* neemt verborgen bestanden niet mee. .htaccess is onderdeel van de
      # applicatie (rewrites + securityregels), dus upload dit bestand apart.
      # Zo voorkomen we tegelijk dat .git/.github naar de webroot gaan.
      - name: Upload .htaccess expliciet naar DEV
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './.htaccess'
          remote_path: '/'
