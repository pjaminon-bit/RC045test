name: Deploy template-foundation naar Strato /dev

on:
  push:
    branches:
      - agent/template-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rc045-dev-deploy
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testcode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Eenmalige cleanup oude beheer-modules
        shell: bash
        run: |
          python3 tools/cleanup-beheer-legacy.py
          php -l beheer.php
          git diff --check
          ! grep -q "id=\"tab-gebruikers\"" beheer.php
          ! grep -q "id=\"tab-log\"" beheer.php
          ! grep -q "id=\"tab-backups\"" beheer.php
          ! grep -q "formulier === 'backup_herstellen'" beheer.php

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add beheer.php paneel.css paneel.js
            git commit -m 'Clean migrated modules from legacy beheer'
            git push origin HEAD:agent/template-foundation
            echo 'Cleanup gecommit; de nieuwe push start een frisse DEV-deploy.'
            exit 0
          fi

      - name: Controleer PHP syntax
        shell: bash
        run: |
          php -v
          while IFS= read -r -d '' bestand; do
            php -l "$bestand"
          done < <(find . -type f -name '*.php' -print0)

      - name: Schrijf DEV buildinformatie
        shell: bash
        run: |
          cat > dev-build.json <<EOF
          {
            "environment": "dev",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "commit_short": "${GITHUB_SHA::8}",
            "deployed_at_utc": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}"
          }
          EOF

      - name: Upload testsite via SFTP naar gekoppelde dev-root
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './*'
          remote_path: '/'

      # ./* neemt verborgen bestanden niet mee. .htaccess is onderdeel van de
      # applicatie (rewrites + securityregels), dus upload dit bestand apart.
      # Zo voorkomen we tegelijk dat .git/.github naar de webroot gaan.
      - name: Upload .htaccess expliciet naar DEV
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './.htaccess'
          remote_path: '/'
