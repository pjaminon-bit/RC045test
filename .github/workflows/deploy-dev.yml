name: Validate RC045test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc045test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Runtimeversies
        run: |
          set -euo pipefail
          php -v
          node --version
          npm --version

      - name: Syntax volledige repository
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' bestand; do
            php -l "$bestand"
          done < <(find . -type f -name '*.php' -not -path './node_modules/*' -print0)
          node --check lidmaatschap-aanmelden.js
          node --check tests/live-dev-browser.spec.js
          node --check tests/live-dev-authenticated.spec.js

      - name: Volledige bronregressie
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -qi '^pdo_sqlite$' || { echo 'pdo_sqlite ontbreekt op de runner' >&2; exit 1; }
          bash tests/run-all.sh
          test ! -e site-config.local.php
