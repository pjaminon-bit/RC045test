name: Validate RC045test

on:
  push:
    branches:
      - agent/template-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc045-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Apache en PHP-FPM runtime voor #226
        shell: bash
        run: |
          set -euo pipefail
          fpm_bin="$(command -v php-fpm 2>/dev/null || true)"
          if [[ -z "$fpm_bin" ]]; then
            fpm_bin="$(find /usr/sbin -maxdepth 1 -type f -name 'php-fpm*' -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ ! -x /usr/sbin/apache2 ]] || [[ -z "$fpm_bin" ]]; then
            sudo apt-get update
            sudo apt-get install --yes apache2 php-fpm
          fi
          /usr/sbin/apache2 -v
          fpm_bin="$(command -v php-fpm 2>/dev/null || true)"
          if [[ -z "$fpm_bin" ]]; then
            fpm_bin="$(find /usr/sbin -maxdepth 1 -type f -name 'php-fpm*' -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$fpm_bin"
          "$fpm_bin" -v

      - name: Runtimeversies
        run: |
          set -euo pipefail
          php -v
          node --version
          npm --version

      - name: Installeer checksum-gepinde PHPStan
        shell: bash
        run: |
          set -euo pipefail
          versie='2.2.13'
          verwacht='a3293d850a9966fbef43e39d04f2b081b8eec35839126c43a54684f21b10ad69'
          phpstan="$RUNNER_TEMP/phpstan-${versie}.phar"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/phpstan/phpstan/releases/download/${versie}/phpstan.phar" \
            --output "$phpstan"
          printf '%s  %s\n' "$verwacht" "$phpstan" | sha256sum --check --strict
          chmod 0555 "$phpstan"
          printf 'PHPSTAN_PHAR=%s\n' "$phpstan" >> "$GITHUB_ENV"

      - name: PHPStan
        shell: bash
        run: |
          set -euo pipefail
          php "$PHPSTAN_PHAR" analyse --configuration=phpstan.neon --no-progress --memory-limit=1G

      - name: Syntax volledige repository
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' bestand; do
            php -l "$bestand"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './var/phpstan/*' -print0)
          node --check lidmaatschap-aanmelden.js
          node --check tests/live-dev-browser.spec.js
          node --check tests/live-dev-authenticated.spec.js
          node --check tests/platform-223-live-browser.spec.js

      - name: Volledige bronregressie
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -qi '^pdo_sqlite$' || { echo 'pdo_sqlite ontbreekt op de runner' >&2; exit 1; }
          bash tests/run-all.sh 2>&1 | tee "$RUNNER_TEMP/regression-output.log"
          test ! -e site-config.local.php

      - name: Bewaar regressiediagnose
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: template-foundation-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/regression-output.log
          if-no-files-found: warn
          retention-days: 14