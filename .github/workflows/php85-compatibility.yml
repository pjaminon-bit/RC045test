name: PHP 8.5 compatibility

on:
  push:
    branches:
      - agent/template-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc045test-php85-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  php85-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact te testen bron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installeer PHP 8.5 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: openssl, pdo_pgsql, mbstring, curl, dom
          coverage: none

      - name: Bind Apache aan PHP 8.5 FPM voor #226
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apache2
          fpm_bin="$(command -v php-fpm8.5 2>/dev/null || true)"
          if [[ -z "$fpm_bin" ]]; then
            fpm_bin="$(command -v php-fpm 2>/dev/null || true)"
          fi
          if [[ -z "$fpm_bin" ]]; then
            fpm_bin="$(find /usr /opt -type f \( -name 'php-fpm8.5' -o -name 'php-fpm' \) -perm -111 2>/dev/null | head -n 1)"
          fi
          if [[ -z "$fpm_bin" || ! -x "$fpm_bin" ]]; then
            echo 'FOUT: setup-php 8.5 leverde geen uitvoerbare PHP-FPM binary.' >&2
            find /usr /opt -type f -name 'php-fpm*' 2>/dev/null | sort >&2 || true
            exit 1
          fi
          sudo ln -sfn "$fpm_bin" /usr/local/bin/php-fpm
          php-fpm -v 2>&1 | head -n 1 | grep -E '^PHP 8\.5\.'
          /usr/sbin/apache2 -v

      - name: Bewijs PHP 8.5 en vereiste modules
        run: |
          set -euo pipefail
          php -v
          php -r 'if (PHP_VERSION_ID < 80500 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "PHP 8.5 vereist\n"); exit(1); }'
          php -m | grep -Fx openssl
          php -m | grep -Fx pdo_pgsql
          php -m | grep -Fx mbstring
          php -m | grep -Fx curl
          php -m | grep -Fx dom
          php -r 'if (!class_exists(DOMDocument::class) || !class_exists(DOMXPath::class)) { fwrite(STDERR, "DOMDocument en DOMXPath vereist\n"); exit(1); }'

      - name: PHP syntax volledige repository
        run: |
          set -euo pipefail
          while IFS= read -r -d '' bestand; do
            php -l "$bestand"
          done < <(find . -type f -name '*.php' -not -path './node_modules/*' -print0)

      - name: Functionele technische en securityregressies op PHP 8.5
        run: bash tests/run-all.sh
