name: Deploy RC045test to VPS test

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Validate RC045test
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: rc045test-vps-test-deploy
  cancel-in-progress: false

jobs:
  deploy-vps-test:
    if: >-
      vars.VPS_TEST_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    environment: vps-test
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VPS_SSH_HOST: ${{ vars.VPS_TEST_SSH_HOST || 'vps.holox.nl' }}
      VPS_SSH_USER: ${{ vars.VPS_TEST_SSH_USER || 'vst-deploy' }}
      VPS_SSH_PORT: ${{ vars.VPS_TEST_SSH_PORT || '22' }}
      VPS_TEST_BASE_URL: https://test.vps.holox.nl
      VPS_TEST_DEPLOY_KEY: ${{ secrets.VPS_TEST_DEPLOY_KEY }}
      VPS_TEST_SSH_KNOWN_HOSTS: ${{ secrets.VPS_TEST_SSH_KNOWN_HOSTS }}
    steps:
      - name: Valideer deployconfiguratie
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Ongeldige release-SHA' >&2; exit 1; }
          [[ -n "${VPS_TEST_DEPLOY_KEY:-}" ]] || { echo 'VPS_TEST_DEPLOY_KEY ontbreekt' >&2; exit 1; }
          [[ -n "${VPS_TEST_SSH_KNOWN_HOSTS:-}" ]] || { echo 'VPS_TEST_SSH_KNOWN_HOSTS ontbreekt' >&2; exit 1; }
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Ongeldige SSH-poort' >&2; exit 1; }

      - name: Configureer gepinde SSH-hosttrust
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$VPS_TEST_DEPLOY_KEY" > "$HOME/.ssh/vps-test-deploy"
          printf '%s\n' "$VPS_TEST_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/vps-test-deploy" "$HOME/.ssh/known_hosts"

      - name: Activeer immutable release op VPS-test
        shell: bash
        run: |
          set -euo pipefail
          output="$(ssh \
            -i "$HOME/.ssh/vps-test-deploy" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_SSH_HOST" \
            "deploy $DEPLOY_SHA")"
          printf '%s\n' "$output"
          grep -Fqx "DEPLOYED $DEPLOY_SHA" <<<"$output" || {
            echo 'VPS meldde niet de verwachte gedeployde commit.' >&2
            exit 1
          }

      - name: Smoke test nieuwe VPS-testrelease
        shell: bash
        run: |
          set -euo pipefail
          wacht_op_status() {
            local url="$1"
            local verwacht="$2"
            local volg_redirects="${3:-nee}"
            local poging status
            for poging in 1 2 3 4 5 6; do
              if [[ "$volg_redirects" == 'ja' ]]; then
                status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              else
                status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              fi
              if [[ "$status" == "$verwacht" ]]; then echo "OK: $url -> HTTP $status"; return 0; fi
              echo "Poging $poging: $url gaf HTTP ${status:-geen}, verwacht $verwacht"; sleep 5
            done
            echo "FOUT: $url gaf na meerdere pogingen niet HTTP $verwacht" >&2
            return 1
          }
          wacht_op_status "$VPS_TEST_BASE_URL/" 200 ja
          wacht_op_status "$VPS_TEST_BASE_URL/beheer/" 200 ja
          wacht_op_status "$VPS_TEST_BASE_URL/healthz.php" 204 nee
          wacht_op_status "$VPS_TEST_BASE_URL/bin/apply-vps-release.php" 403 nee
