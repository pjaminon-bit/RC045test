name: Deploy RC045test to VPS test

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Full regression acceptance
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: rc045test-vps-test-deploy
  cancel-in-progress: false

jobs:
  deploy-vps-test:
    if: >-
      vars.VPS_TEST_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    environment: vps-test
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      VPS_TAILSCALE_HOST: ${{ vars.VPS_TEST_TAILSCALE_HOST || '100.104.242.66' }}
      VPS_SSH_HOST_ALIAS: vps.holox.nl
      VPS_SSH_USER: ${{ vars.VPS_TEST_SSH_USER || 'vst-deploy' }}
      VPS_SSH_PORT: ${{ vars.VPS_TEST_SSH_PORT || '22' }}
      VPS_TEST_BASE_URL: https://test.vps.holox.nl
    steps:
      - name: Valideer gemergde PR-lineage voor iedere deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Ongeldige release-SHA' >&2; exit 1; }
          gekoppelde_prs="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/pulls")"
          jq -e 'any(.[]; .merged_at != null and .base.ref == "main")' <<<"$gekoppelde_prs" >/dev/null || {
            echo 'Deploy geweigerd: release-SHA is niet afkomstig uit een gemergde pull request naar main.' >&2
            exit 1
          }

      - name: Valideer deployconfiguratie
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Ongeldige release-SHA' >&2; exit 1; }
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Ongeldige SSH-poort' >&2; exit 1; }
          [[ "$VPS_TAILSCALE_HOST" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo 'VPS_TEST_TAILSCALE_HOST moet een Tailscale IPv4-adres zijn' >&2; exit 1; }

      - name: Verbind GitHub-runner met private tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-rc045test
          version: 1.94.2
          ping: ${{ vars.VPS_TEST_TAILSCALE_HOST || '100.104.242.66' }}

      - name: Activeer immutable release op VPS-test via Tailscale
        env:
          VPS_TEST_DEPLOY_KEY: ${{ secrets.VPS_TEST_DEPLOY_KEY }}
          VPS_TEST_SSH_KNOWN_HOSTS: ${{ secrets.VPS_TEST_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VPS_TEST_DEPLOY_KEY:-}" ]] || { echo 'VPS_TEST_DEPLOY_KEY ontbreekt' >&2; exit 1; }
          [[ -n "${VPS_TEST_SSH_KNOWN_HOSTS:-}" ]] || { echo 'VPS_TEST_SSH_KNOWN_HOSTS ontbreekt' >&2; exit 1; }
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/vps-deploy-ssh.XXXXXX")"
          finish() {
            rc=$?
            trap - EXIT
            rm -rf "$ssh_dir"
            exit "$rc"
          }
          trap finish EXIT
          chmod 700 "$ssh_dir"
          umask 077
          key="$ssh_dir/deploy-key"
          known_hosts="$ssh_dir/known_hosts"
          printf '%s\n' "$VPS_TEST_DEPLOY_KEY" > "$key"
          printf '%s\n' "$VPS_TEST_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          output="$(ssh \
            -i "$key" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o HostKeyAlias="$VPS_SSH_HOST_ALIAS" \
            -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_TAILSCALE_HOST" \
            "deploy $DEPLOY_SHA")"
          printf '%s\n' "$output"
          grep -Fqx "DEPLOYED $DEPLOY_SHA" <<<"$output" || {
            echo 'VPS meldde niet de verwachte gedeployde commit.' >&2
            exit 1
          }

      - name: Smoke test nieuwe VPS-testrelease
        shell: bash
        run: |
          set -euo pipefail
          wacht_op_status() {
            local url="$1"
            local verwacht="$2"
            local volg_redirects="${3:-nee}"
            local poging status
            for poging in 1 2 3 4 5 6; do
              if [[ "$volg_redirects" == 'ja' ]]; then
                status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              else
                status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 10 --max-time 30 "$url" || true)"
              fi
              if [[ "$status" == "$verwacht" ]]; then echo "OK: $url -> HTTP $status"; return 0; fi
              echo "Poging $poging: $url gaf HTTP ${status:-geen}, verwacht $verwacht"; sleep 5
            done
            echo "FOUT: $url gaf na meerdere pogingen niet HTTP $verwacht" >&2
            return 1
          }
          wacht_op_status "$VPS_TEST_BASE_URL/" 200 ja
          wacht_op_status "$VPS_TEST_BASE_URL/beheer/" 200 ja
          wacht_op_status "$VPS_TEST_BASE_URL/healthz.php" 204 nee
          wacht_op_status "$VPS_TEST_BASE_URL/bin/apply-vps-release.php" 403 nee

  e2e-fixture-setup:
    needs: deploy-vps-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vps-test
    permissions:
      id-token: write
    outputs:
      e2e_password_ciphertext: ${{ steps.fixture.outputs.e2e_password_ciphertext }}
    env:
      VPS_TAILSCALE_HOST: ${{ vars.VPS_TEST_TAILSCALE_HOST || '100.104.242.66' }}
      VPS_SSH_HOST_ALIAS: vps.holox.nl
      VPS_SSH_USER: ${{ vars.VPS_TEST_SSH_USER || 'vst-deploy' }}
      VPS_SSH_PORT: ${{ vars.VPS_TEST_SSH_PORT || '22' }}
    steps:
      - name: Valideer private E2E-route
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Ongeldige SSH-poort' >&2; exit 1; }
          [[ "$VPS_TAILSCALE_HOST" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo 'VPS_TEST_TAILSCALE_HOST moet een Tailscale IPv4-adres zijn' >&2; exit 1; }

      - name: Verbind fixture-runner met private tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-rc045test
          version: 1.94.2
          ping: ${{ vars.VPS_TEST_TAILSCALE_HOST || '100.104.242.66' }}

      - name: Controleer gateway en maak ephemeral authenticated fixture
        id: fixture
        env:
          VPS_TEST_DEPLOY_KEY: ${{ secrets.VPS_TEST_DEPLOY_KEY }}
          VPS_TEST_SSH_KNOWN_HOSTS: ${{ secrets.VPS_TEST_SSH_KNOWN_HOSTS }}
          E2E_CREDENTIAL_WRAP_KEY: ${{ secrets.E2E_CREDENTIAL_WRAP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VPS_TEST_DEPLOY_KEY:-}" ]] || { echo 'VPS_TEST_DEPLOY_KEY ontbreekt' >&2; exit 1; }
          [[ -n "${VPS_TEST_SSH_KNOWN_HOSTS:-}" ]] || { echo 'VPS_TEST_SSH_KNOWN_HOSTS ontbreekt' >&2; exit 1; }
          [[ ${#E2E_CREDENTIAL_WRAP_KEY} -ge 32 && ${#E2E_CREDENTIAL_WRAP_KEY} -le 256 ]] || { echo 'E2E_CREDENTIAL_WRAP_KEY ontbreekt of is ongeldig' >&2; exit 1; }
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/vps-e2e-setup-ssh.XXXXXX")"
          gateway_ready=0
          finish() {
            rc=$?
            trap - EXIT
            if [[ "$rc" -ne 0 && "$gateway_ready" -eq 1 ]]; then
              ssh \
                -i "$key" -p "$VPS_SSH_PORT" \
                -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$known_hosts" -o HostKeyAlias="$VPS_SSH_HOST_ALIAS" -o ConnectTimeout=15 \
                "$VPS_SSH_USER@$VPS_TAILSCALE_HOST" 'e2e cleanup' >/dev/null 2>&1 || true
            fi
            rm -rf "$ssh_dir"
            exit "$rc"
          }
          trap finish EXIT
          chmod 700 "$ssh_dir"
          umask 077
          key="$ssh_dir/deploy-key"
          known_hosts="$ssh_dir/known_hosts"
          printf '%s\n' "$VPS_TEST_DEPLOY_KEY" > "$key"
          printf '%s\n' "$VPS_TEST_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"

          check="$(ssh \
            -i "$key" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o HostKeyAlias="$VPS_SSH_HOST_ALIAS" -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_TAILSCALE_HOST" 'e2e check')"
          printf '%s\n' "$check"
          grep -Fqx 'E2E EPHEMERAL CHECK OK  tenant=test storage=pdo fixture=vps-authenticated-e2e-v1' <<<"$check"
          gateway_ready=1

          stale="$(ssh \
            -i "$key" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o HostKeyAlias="$VPS_SSH_HOST_ALIAS" -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_TAILSCALE_HOST" 'e2e cleanup')"
          printf '%s\n' "$stale"
          grep -Eq '^E2E CLEANUP OK  tenant=test removed=[0-9]+ fixture=vps-authenticated-e2e-v1$' <<<"$stale"

          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          [[ ${#password} -ge 32 && ${#password} -le 256 ]] || { echo 'Genereren ephemeral wachtwoord faalde' >&2; exit 1; }
          echo "::add-mask::$password"
          apply="$(printf '%s\n' "$password" | ssh \
            -i "$key" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o HostKeyAlias="$VPS_SSH_HOST_ALIAS" -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_TAILSCALE_HOST" 'e2e apply')"
          printf '%s\n' "$apply"
          grep -Fqx 'E2E APPLY OK  tenant=test accounts=2 linked_member=1 fixture=vps-authenticated-e2e-v1' <<<"$apply"

          ciphertext="$(printf '%s' "$password" | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -a -A -pass env:E2E_CREDENTIAL_WRAP_KEY)"
          [[ -n "$ciphertext" ]] || { echo 'Versleutelen ephemeral E2E-wachtwoord faalde' >&2; exit 1; }
          tag="$(E2E_CIPHERTEXT="$ciphertext" python3 -c 'import hashlib,hmac,os; print(hmac.new(os.environ["E2E_CREDENTIAL_WRAP_KEY"].encode(), os.environ["E2E_CIPHERTEXT"].encode(), hashlib.sha256).hexdigest())')"
          [[ "$tag" =~ ^[0-9a-f]{64}$ ]] || { echo 'Integriteitstag voor E2E-credential faalde' >&2; exit 1; }
          printf 'e2e_password_ciphertext=%s.%s\n' "$tag" "$ciphertext" >> "$GITHUB_OUTPUT"
          unset password ciphertext tag

  live-authenticated:
    needs: e2e-fixture-setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PLAYWRIGHT_TEST_BASE_URL: https://test.vps.holox.nl
      E2E_ADMIN_USER: vps-e2e-admin
      E2E_MEMBER_USER: vps-e2e-member
    steps:
      - name: Checkout exact gedeployde bron
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Valideer browseracceptatieconfiguratie
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Ongeldige release-SHA' >&2; exit 1; }
          [[ "$E2E_ADMIN_USER" == 'vps-e2e-admin' && "$E2E_MEMBER_USER" == 'vps-e2e-member' ]] || { echo 'Onverwachte E2E-identiteiten' >&2; exit 1; }

      - name: Installeer gelockte browsertooling
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Ontsleutel ephemeral applicatiecredential vlak voor browsergebruik
        id: credential
        env:
          E2E_CREDENTIAL_WRAP_KEY: ${{ secrets.E2E_CREDENTIAL_WRAP_KEY }}
          E2E_PASSWORD_CIPHERTEXT: ${{ needs.e2e-fixture-setup.outputs.e2e_password_ciphertext }}
        shell: bash
        run: |
          set -euo pipefail
          [[ ${#E2E_CREDENTIAL_WRAP_KEY} -ge 32 && ${#E2E_CREDENTIAL_WRAP_KEY} -le 256 ]] || { echo 'E2E_CREDENTIAL_WRAP_KEY ontbreekt of is ongeldig' >&2; exit 1; }
          package="$E2E_PASSWORD_CIPHERTEXT"
          tag="${package%%.*}"
          ciphertext="${package#*.}"
          [[ "$tag" =~ ^[0-9a-f]{64}$ && -n "$ciphertext" && "$ciphertext" != "$package" ]] || { echo 'Versleutelde E2E-credential is ongeldig' >&2; exit 1; }
          E2E_TAG="$tag" E2E_CIPHERTEXT="$ciphertext" python3 -c 'import hashlib,hmac,os,sys; expected=hmac.new(os.environ["E2E_CREDENTIAL_WRAP_KEY"].encode(), os.environ["E2E_CIPHERTEXT"].encode(), hashlib.sha256).hexdigest(); sys.exit(0 if hmac.compare_digest(expected, os.environ["E2E_TAG"]) else 1)' || { echo 'Integriteitscontrole E2E-credential faalde' >&2; exit 1; }
          password="$(printf '%s' "$ciphertext" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -A -pass env:E2E_CREDENTIAL_WRAP_KEY)"
          [[ ${#password} -ge 32 && ${#password} -le 256 ]] || { echo 'Ontsleutelde E2E-credential is ongeldig' >&2; exit 1; }
          echo "::add-mask::$password"
          password_file="$RUNNER_TEMP/e2e-password-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          printf '%s' "$password" > "$password_file"
          chmod 600 "$password_file"
          printf 'password_file=%s\n' "$password_file" >> "$GITHUB_OUTPUT"
          unset password ciphertext tag package

      - name: Bewijs authenticated beheer en gekoppeld ledenportaal
        env:
          E2E_PASSWORD_FILE: ${{ steps.credential.outputs.password_file }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$E2E_PASSWORD_FILE" ]] || { echo 'Ephemeral E2E-credentialbestand ontbreekt' >&2; exit 1; }
          E2E_PASSWORD="$(cat "$E2E_PASSWORD_FILE")"
          [[ ${#E2E_PASSWORD} -ge 32 && ${#E2E_PASSWORD} -le 256 ]] || { echo 'Ephemeral E2E-wachtwoord ontbreekt of is ongeldig' >&2; exit 1; }
          export E2E_PASSWORD
          npx playwright test tests/live-dev-authenticated.spec.js --workers=1 --reporter=line,html

      - name: Controleer browserartifacts op plaintextcredential
        id: artifact-scan
        if: ${{ always() && steps.credential.outcome == 'success' }}
        env:
          E2E_PASSWORD_FILE: ${{ steps.credential.outputs.password_file }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$E2E_PASSWORD_FILE" ]] || { echo 'Credentialbestand ontbreekt vóór artifactscan' >&2; exit 1; }
          password="$(cat "$E2E_PASSWORD_FILE")"
          echo "::add-mask::$password"
          leak=0
          for dir in playwright-report test-results; do
            [[ -e "$dir" ]] || continue
            if grep -R -a -F -l -- "$password" "$dir" >"$RUNNER_TEMP/e2e-artifact-credential-hits.txt" 2>/dev/null; then
              leak=1
              break
            fi
          done
          if [[ "$leak" -ne 0 ]]; then
            rm -rf playwright-report test-results
            rm -f "$RUNNER_TEMP/e2e-artifact-credential-hits.txt"
            echo 'Authenticated browserartifact bevatte plaintextcredential en is verwijderd; upload geweigerd.' >&2
            exit 1
          fi
          rm -f "$RUNNER_TEMP/e2e-artifact-credential-hits.txt"
          echo 'safe=true' >> "$GITHUB_OUTPUT"
          unset password

      - name: Verwijder lokaal ephemeral credentialbestand
        if: ${{ always() }}
        env:
          E2E_PASSWORD_FILE: ${{ steps.credential.outputs.password_file }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${E2E_PASSWORD_FILE:-}" ]]; then
            rm -f -- "$E2E_PASSWORD_FILE"
          fi

      - name: Bewaar authenticated screenshots en rapport
        if: ${{ always() && steps.artifact-scan.outputs.safe == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: authenticated-browser-acceptance-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30

  e2e-fixture-cleanup:
    needs:
      - e2e-fixture-setup
      - live-authenticated
    if: ${{ always() && needs.e2e-fixture-setup.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: vps-test
    permissions:
      id-token: write
    env:
      VPS_TAILSCALE_HOST: ${{ vars.VPS_TEST_TAILSCALE_HOST || '100.104.242.66' }}
      VPS_SSH_HOST_ALIAS: vps.holox.nl
      VPS_SSH_USER: ${{ vars.VPS_TEST_SSH_USER || 'vst-deploy' }}
      VPS_SSH_PORT: ${{ vars.VPS_TEST_SSH_PORT || '22' }}
    steps:
      - name: Valideer private cleanup-route
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Ongeldige SSH-poort' >&2; exit 1; }
          [[ "$VPS_TAILSCALE_HOST" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || { echo 'VPS_TEST_TAILSCALE_HOST moet een Tailscale IPv4-adres zijn' >&2; exit 1; }

      - name: Verbind cleanup-runner met private tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-rc045test
          version: 1.94.2
          ping: ${{ vars.VPS_TEST_TAILSCALE_HOST || '100.104.242.66' }}

      - name: Verwijder ephemeral authenticated fixture
        env:
          VPS_TEST_DEPLOY_KEY: ${{ secrets.VPS_TEST_DEPLOY_KEY }}
          VPS_TEST_SSH_KNOWN_HOSTS: ${{ secrets.VPS_TEST_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${VPS_TEST_DEPLOY_KEY:-}" ]] || { echo 'VPS_TEST_DEPLOY_KEY ontbreekt' >&2; exit 1; }
          [[ -n "${VPS_TEST_SSH_KNOWN_HOSTS:-}" ]] || { echo 'VPS_TEST_SSH_KNOWN_HOSTS ontbreekt' >&2; exit 1; }
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/vps-e2e-cleanup-ssh.XXXXXX")"
          finish() {
            rc=$?
            trap - EXIT
            rm -rf "$ssh_dir"
            exit "$rc"
          }
          trap finish EXIT
          chmod 700 "$ssh_dir"
          umask 077
          key="$ssh_dir/deploy-key"
          known_hosts="$ssh_dir/known_hosts"
          printf '%s\n' "$VPS_TEST_DEPLOY_KEY" > "$key"
          printf '%s\n' "$VPS_TEST_SSH_KNOWN_HOSTS" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          output="$(ssh \
            -i "$key" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" -o HostKeyAlias="$VPS_SSH_HOST_ALIAS" -o ConnectTimeout=15 \
            "$VPS_SSH_USER@$VPS_TAILSCALE_HOST" 'e2e cleanup')"
          printf '%s\n' "$output"
          grep -Eq '^E2E CLEANUP OK  tenant=test removed=[0-9]+ fixture=vps-authenticated-e2e-v1$' <<<"$output"
