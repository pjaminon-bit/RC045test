name: One-time real beheer directory refactor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refactor-beheer-real-directory-main.yml

permissions:
  contents: write

jobs:
  refactor-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DEV branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/template-foundation
          fetch-depth: 0

      - name: Convert beheer to a real directory app
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          old = root / 'beheer.php'
          target = root / 'beheer' / 'index.php'
          if not old.exists():
              raise SystemExit('beheer.php ontbreekt')
          s = old.read_text(encoding='utf-8')

          # De code verhuist één map dieper. Alle server-side paden moeten naar
          # de installatie-root blijven wijzen. dirname(__DIR__) is vanuit
          # beheer/index.php precies die root, zowel in /dev als productie.
          s = s.replace('__DIR__', 'dirname(__DIR__)')

          # Formulieren en PRG-redirects blijven binnen de echte beheer-map.
          s = s.replace('action="beheer.php#', 'action="./#')
          s = s.replace('action="beheer.php"', 'action="./"')
          s = s.replace("header('Location: beheer.php#fotoboek');", "header('Location: ./#fotoboek');")

          # De no-access kaart verwijst naar de echte/compatibele ledeningang.
          s = s.replace('href="leden.php"', 'href="../leden/"')

          # Browser-assets staan in de installatie-root, dus vanuit beheer/ één
          # map omhoog. Alleen echte browserpaden wijzigen; server-side filemtime
          # is hierboven al door dirname(__DIR__) afgedekt.
          s = s.replace('href="favicon-32x32.png"', 'href="../favicon-32x32.png"')
          s = s.replace('href="paneel.css?', 'href="../paneel.css?')
          s = s.replace('src="paneel-thema.js?', 'src="../paneel-thema.js?')
          s = s.replace('src="paneel.js?', 'src="../paneel.js?')
          s = s.replace('src="images/', 'src="../images/')
          s = s.replace("url('images/", "url('../images/")
          s = s.replace('href="index.html"', 'href="../index.html"')

          # Zelfstandige modules staan nu fysiek naast index.php. Geen base-URL
          # berekening of /beheer-prefix meer nodig.
          s = re.sub(r"\n\s*// Basis-URL van deze installatie\.[^\n]*\n\s*// zodat dit zowel onder /dev als in de domeinroot werkt\.\n\s*\$beheerInstallatieBasis = [^;]+;", '', s)
          s = s.replace("'gebruikers' => ['label' => 'Gebruikers', 'href' => $beheerInstallatieBasis . '/beheer/gebruikers.php'],", "'gebruikers' => ['label' => 'Gebruikers', 'href' => 'gebruikers.php'],")
          s = s.replace("'log'        => ['label' => 'Logboek', 'href' => $beheerInstallatieBasis . '/beheer/logboek.php'],", "'log'        => ['label' => 'Logboek', 'href' => 'logboek.php'],")
          s = s.replace("'backups'    => ['label' => 'Back-ups', 'href' => $beheerInstallatieBasis . '/beheer/backups.php'],", "'backups'    => ['label' => 'Back-ups', 'href' => 'backups.php'],")

          # Sanity checks vóór schrijven.
          forbidden = [
              'action="beheer.php',
              "Location: beheer.php#fotoboek",
              '$beheerInstallatieBasis',
              'href="paneel.css',
              'src="paneel.js',
              'src="paneel-thema.js',
              'src="images/',
              "url('images/",
          ]
          leftovers = [x for x in forbidden if x in s]
          if leftovers:
              raise SystemExit('beheer/index.php bevat nog oude relatieve paden: ' + ', '.join(leftovers))

          target.write_text(s, encoding='utf-8')

          # Oude bestands-URL blijft bestaan als compatibiliteitsingang, maar
          # bevat geen applicatielogica meer. 308 behoudt methode/body mocht een
          # oude client toch nog een POST naar beheer.php sturen.
          old.write_text("""<?php
// Backwards-compatible ingang. Het beheer is nu een echte map met index.php.
$script = str_replace('\\\\', '/', (string) ($_SERVER['SCRIPT_NAME'] ?? '/beheer.php'));
$basis = rtrim(str_replace('\\\\', '/', dirname($script)), '/');
header('Location: ' . ($basis === '' ? '' : $basis) . '/beheer/', true, 308);
exit;
""", encoding='utf-8')

          # paneel.js wordt zowel vanuit rootpagina's als beheer/ geladen. Laat
          # endpoints daarom resolven vanaf de URL van paneel.js zelf, niet vanaf
          # document.location. Dat maakt ook toekomstige submappen vanzelf veilig.
          js = (root / 'paneel.js').read_text(encoding='utf-8')
          if 'var PANEEL_ROOT_URL' not in js:
              js = js.replace("(function() {\n", "(function() {\n      var PANEEL_SCRIPT_URL = document.currentScript && document.currentScript.src ? document.currentScript.src : location.href;\n      var PANEEL_ROOT_URL = new URL('.', PANEEL_SCRIPT_URL);\n", 1)
          js = js.replace("fetch('vertaal.php'", "fetch(new URL('vertaal.php', PANEEL_ROOT_URL)")
          js = js.replace("script.src = 'vendor/heic2any/heic2any.min.js';", "script.src = new URL('vendor/heic2any/heic2any.min.js', PANEEL_ROOT_URL).href;")
          (root / 'paneel.js').write_text(js, encoding='utf-8')

          # Beheer is nu een echte map; verwijder alle beheer-specifieke virtuele
          # routepleisters. Leden is nog legacy en houdt voorlopig zijn eigen
          # beperkte fallbacks.
          hp = (root / '.htaccess').read_text(encoding='utf-8')
          start = hp.find('# ===== Virtuele routes: relatieve assets en publieke endpoints =====')
          end = hp.find('# ===== Fotoboek: nette album-URL\'s =====', start)
          if start < 0 or end < 0:
              raise SystemExit('virtuele-routeblok in .htaccess niet gevonden')
          leden_block = """# ===== Virtuele ledenroute: relatieve assets en publieke endpoints =====
# /leden/ is voorlopig nog een interne rewrite naar leden.php. Alleen voor die
# legacy-route blijven de expliciete publieke fallbacks nodig. Beheer is een
# echte map en heeft deze regels niet meer nodig.
RewriteRule ^leden/(paneel\\.css|paneel\\.js|paneel-thema\\.js|favicon-32x32\\.png)$ $1 [L,QSA,NC]
RewriteRule ^leden/(vertaal\\.php)$ $1 [L,QSA,NC]
RewriteRule ^leden/(vendor/heic2any/heic2any\\.min\\.js)$ $1 [L,QSA,NC]
RewriteRule ^leden/leden\\.php$ leden.php [L,QSA,NC]


"""
          hp = hp[:start] + leden_block + hp[end:]

          # De vriendelijke /beheer/ rewrite is overbodig: DirectoryIndex
          # index.php doet dit standaard voor de echte map.
          hp = re.sub(r"\n# ===== Beheer =====\n# Intern herschrijven\.[\s\S]*?RewriteRule \^beheer/\?\$ beheer\.php \[L\]\n", "\n", hp, count=1)
          if 'RewriteRule ^beheer/?$ beheer.php' in hp or 'beheer/beheer/' in hp or 'beheer/beheer\\.php' in hp:
              raise SystemExit('beheer-rewrite/fallback is nog aanwezig')
          (root / '.htaccess').write_text(hp, encoding='utf-8')
          PY

      - name: Validate refactor
        shell: bash
        run: |
          php -l beheer.php
          php -l beheer/index.php
          php -l beheer/gebruikers.php
          php -l beheer/logboek.php
          php -l beheer/backups.php
          git diff --check
          grep -q "href=\"../paneel.css" beheer/index.php
          grep -q "'href' => 'logboek.php'" beheer/index.php
          grep -q "action=\"./#homepage\"" beheer/index.php
          grep -q "Location: ./#fotoboek" beheer/index.php
          ! grep -q "RewriteRule \^beheer/?\$ beheer.php" .htaccess
          ! grep -q "beheer/beheer/" .htaccess

      - name: Commit refactor to DEV
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add beheer.php beheer/index.php paneel.js .htaccess
          git commit -m 'Make beheer a real directory application'
          git push origin HEAD:agent/template-foundation
